packages:
  - 'apps/*'
  - 'packages/*'

publicHoistPattern:
  - '*'

blockExoticSubdeps: false

onlyBuiltDependencies:
  - '@bitdisaster/exe-icon-extractor'
  - '@nestjs/core'
  - '@sentry/cli'
  - '@swc/core'
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - keytar
  - protobufjs
  - sharp

allowBuilds:
  '@bitdisaster/exe-icon-extractor': true
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: true
  protobufjs: true
  sharp: true
