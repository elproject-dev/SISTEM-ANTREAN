name: Deploy Sistem Antrean to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build sistem-antrean
        run: pnpm -F sistem-antrean build
        env:
          VITE_SUPABASE_URL: https://wnozfcqgcmvxvkxbxgfj.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indub3pmY3FnY212eHZreGJ4Z2ZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDIwMjMsImV4cCI6MjA5ODkxODAyM30.00v4HUxsKgNxupMPdWMo6XeWxWKrX7B7qRXhoh1cttg

      - name: Generate 404.html for SPA routing
        run: cp apps/sistem-antrean/dist/index.html apps/sistem-antrean/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/sistem-antrean/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
